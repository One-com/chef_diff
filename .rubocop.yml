AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

# Development dependencies are intentionally declared in the gemspec.
Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# RSpec example groups and the gemspec are naturally long blocks.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

# Specs manipulate the class-level @@logger directly to exercise its branches.
Style/ClassVars:
  Exclude:
    - 'spec/**/*'

